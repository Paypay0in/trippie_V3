<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Trippie. A pin, drawn as the join between two days.

    Follows the approved visual system: deep navy ground, the blue-to-violet
    gradient the product reserves for its primary action. No wordmark — at
    48px on a home screen a word is a smudge, and the shape has to be legible
    at the size it will actually be seen.
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2F5BFF"/>
      <stop offset="100%" stop-color="#8B3DFF"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#11183d"/>
  <path d="M256 112c-59 0-107 47-107 106 0 78 92 168 103 178a6 6 0 0 0 8 0c11-10 103-100 103-178 0-59-48-106-107-106z" fill="url(#g)"/>
  <circle cx="256" cy="218" r="40" fill="#ffffff"/>
</svg>
